<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>컴터어때 관리자센터</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0B0B0D] text-white min-h-screen"><header class="border-b border-gray-800 p-5 flex justify-between"><div><b class="text-xl">컴터어때 관리자센터</b><p class="text-xs text-gray-500 mt-1">고객 · 업체 · 승인 관리</p></div><button onclick="logout()" class="border border-gray-700 px-4 py-2 rounded-xl text-sm">로그아웃</button></header><main class="max-w-7xl mx-auto p-5"><div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div><section class="bg-[#16161A] border border-gray-800 rounded-2xl p-5 mb-6"><div class="flex justify-between mb-4"><h2 class="font-bold">업체 관리</h2><button onclick="load()" class="text-xs border border-gray-700 px-3 py-2 rounded-lg">새로고침</button></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-gray-500 border-b border-gray-800"><th class="text-left p-2">업체명</th><th class="text-left p-2">아이디</th><th class="text-left p-2">연락처</th><th class="text-left p-2">상태</th><th class="p-2">관리</th></tr></thead><tbody id="shops"></tbody></table></div></section><section class="bg-[#16161A] border border-gray-800 rounded-2xl p-5"><h2 class="font-bold mb-4">고객 관리</h2><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-gray-500 border-b border-gray-800"><th class="text-left p-2">이름</th><th class="text-left p-2">아이디</th><th class="text-left p-2">연락처</th><th class="text-left p-2">가입일</th><th class="p-2">관리</th></tr></thead><tbody id="users"></tbody></table></div></section><p id="msg" class="text-sm text-red-400 mt-4"></p></main><script>const token=localStorage.getItem('comter_token');const headers={Authorization:'Bearer '+token};if(!token)location.href='login.html';function logout(){localStorage.clear();location.href='login.html'}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers,...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'오류');return d}async function load(){try{const [s,u,st]=await Promise.all([api('/api/admin/shops'),api('/api/admin/users'),api('/api/admin/stats')]);stats.innerHTML=[['고객',st.customers],['전체 업체',st.shops],['승인 대기',st.pending],['승인 업체',st.approved]].map(x=>`<div class="bg-[#16161A] border border-gray-800 rounded-2xl p-4"><div class="text-xs text-gray-500">${x[0]}</div><div class="text-2xl font-black mt-1">${x[1]}</div></div>`).join('');shops.innerHTML=s.shops.map(x=>`<tr class="border-b border-gray-800"><td class="p-2 font-bold">${esc(x.shop_name)}</td><td class="p-2">${esc(x.username)}</td><td class="p-2">${esc(x.phone||'-')}</td><td class="p-2">${status(x.status)}</td><td class="p-2 text-center">${x.status==='pending'?`<button onclick="setShop(${x.id},'approved')" class="bg-green-700 px-2 py-1 rounded-lg mr-1">승인</button>`:''}${x.status==='approved'?`<button onclick="setShop(${x.id},'pending')" class="bg-gray-700 px-2 py-1 rounded-lg mr-1">승인취소</button>`:''}<button onclick="delShop(${x.id})" class="bg-red-700 px-2 py-1 rounded-lg">삭제</button></td></tr>`).join('')||'<tr><td colspan="5" class="p-5 text-center text-gray-500">등록 업체 없음</td></tr>';users.innerHTML=u.users.filter(x=>x.role==='customer').map(x=>`<tr class="border-b border-gray-800"><td class="p-2">${esc(x.name)}</td><td class="p-2">${esc(x.username)}</td><td class="p-2">${esc(x.phone||'-')}</td><td class="p-2">${new Date(x.created_at).toLocaleString('ko-KR')}</td><td class="p-2 text-center"><button onclick="delUser(${x.id})" class="bg-red-700 px-2 py-1 rounded-lg">삭제</button></td></tr>`).join('')||'<tr><td colspan="5" class="p-5 text-center text-gray-500">등록 고객 없음</td></tr>';}catch(e){msg.textContent=e.message;if(e.message.includes('관리자'))setTimeout(()=>location.href='login.html',800)}}async function setShop(id,status){if(!confirm(status==='approved'?'업체를 승인할까요?':'업체 승인을 취소할까요?'))return;await api('/api/admin/shops/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}async function delShop(id){if(!confirm('업체와 업체 계정을 삭제할까요?'))return;await api('/api/admin/shops/'+id,{method:'DELETE'});load()}async function delUser(id){if(!confirm('고객 계정을 삭제할까요?'))return;await api('/api/admin/users/'+id,{method:'DELETE'});load()}function status(s){return s==='approved'?'<span class="text-green-400">승인</span>':s==='pending'?'<span class="text-yellow-400">승인대기</span>':'<span class="text-red-400">거절</span>'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
