<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>컴터어때 회원가입</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#0B0B0D] text-white flex items-center justify-center p-5"><main class="w-full max-w-lg bg-[#16161A] border border-gray-800 rounded-2xl p-7"><h1 class="text-2xl font-black">컴터어때 회원가입</h1><div class="flex gap-2 my-5"><button type="button" id="customer" class="flex-1 p-3 rounded-xl bg-red-600 font-bold">고객</button><button type="button" id="shop" class="flex-1 p-3 rounded-xl border border-gray-700">업체</button></div><form id="f" class="space-y-3"><input id="name" required placeholder="이름" class="w-full p-3 rounded-xl bg-[#0B0B0D] border border-gray-700"><input id="username" required placeholder="아이디" class="w-full p-3 rounded-xl bg-[#0B0B0D] border border-gray-700"><input id="password" required type="password" placeholder="비밀번호" class="w-full p-3 rounded-xl bg-[#0B0B0D] border border-gray-700"><input id="phone" placeholder="연락처" class="w-full p-3 rounded-xl bg-[#0B0B0D] border border-gray-700"><input id="address" placeholder="주소" class="w-full p-3 rounded-xl bg-[#0B0B0D] border border-gray-700"><input id="shopName" placeholder="업체명 (업체 회원가입 시)" class="w-full p-3 rounded-xl bg-[#0B0B0D] border border-gray-700 hidden"><button class="w-full bg-red-600 rounded-xl p-3 font-bold">가입하기</button></form><p id="msg" class="text-sm mt-4 text-gray-400"></p><a href="login.html" class="block text-center mt-5 text-gray-400">로그인으로 돌아가기</a></main><script>let type='customer';customer.onclick=()=>{type='customer';customer.className='flex-1 p-3 rounded-xl bg-red-600 font-bold';shop.className='flex-1 p-3 rounded-xl border border-gray-700';shopName.classList.add('hidden')};shop.onclick=()=>{type='shop';shop.className='flex-1 p-3 rounded-xl bg-red-600 font-bold';customer.className='flex-1 p-3 rounded-xl border border-gray-700';shopName.classList.remove('hidden')};f.onsubmit=async e=>{e.preventDefault();msg.textContent='가입 처리 중...';const body={name:name.value,username:username.value,password:password.value,phone:phone.value,address:address.value,type,shopName:shopName.value};try{const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);msg.textContent=d.message;msg.className='text-sm mt-4 text-green-400';if(type==='customer')setTimeout(()=>location.href='login.html',800);}catch(x){msg.textContent=x.message;msg.className='text-sm mt-4 text-red-400';}}</script></body></html>
