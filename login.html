<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>컴터어때 로그인</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff;color:#111;font-family:Arial,'Noto Sans KR',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:430px;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:32px;box-shadow:0 20px 60px rgba(17,24,39,.10)}.logo{font-size:30px;font-weight:900;letter-spacing:-1px;color:#ea580c}.logo span{color:#111}.sub{color:#6b7280;font-size:14px;margin:7px 0 24px}input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;margin-bottom:10px;font-size:14px;outline:none;background:#fff;color:#111}input:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.12)}button{width:100%;padding:14px;border:0;border-radius:12px;background:#f97316;color:#fff;font-size:15px;font-weight:800;cursor:pointer}button:hover{background:#ea580c}.msg{min-height:22px;margin-top:12px;font-size:13px;color:#dc2626}.links{display:flex;gap:10px;margin-top:10px}.links a{flex:1;text-align:center;text-decoration:none;color:#111;border:1px solid #e5e7eb;border-radius:12px;padding:12px;font-size:13px}.links a:hover{border-color:#f97316;color:#ea580c}.brandline{height:4px;width:48px;background:#f97316;border-radius:99px;margin-bottom:18px}</style></head><body><main class="card"><div class="brandline"></div><div class="logo">COMTER<span>.</span></div><p class="sub">컴터어때 로그인</p><form id="f"><input id="username" required autocomplete="username" placeholder="아이디"><input id="password" required type="password" autocomplete="current-password" placeholder="비밀번호"><button type="submit">로그인</button></form><p id="msg" class="msg"></p><div class="links"><a href="signup.html">회원가입</a><a href="comter.html">홈으로</a></div></main><script>const form=document.getElementById('f');const username=document.getElementById('username');const password=document.getElementById('password');const msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();msg.style.color='#6b7280';msg.textContent='로그인 중...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'로그인 실패');localStorage.setItem('comter_token',d.token);localStorage.setItem('comter_user',JSON.stringify(d.user));location.href=d.user.role==='admin'?'admin.html':'comter.html'}catch(err){msg.style.color='#dc2626';msg.textContent=err.message}});</script></body></html>
