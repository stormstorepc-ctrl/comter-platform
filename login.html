<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>컴터어때 로그인</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#0B0B0D] text-white flex items-center justify-center p-5"><main class="w-full max-w-md bg-[#16161A] border border-gray-800 rounded-2xl p-7"><h1 class="text-2xl font-black mb-2">COMTER<span class="text-red-600">.</span></h1><p class="text-gray-400 text-sm mb-6">컴터어때 로그인</p><form id="f" class="space-y-3"><input id="username" required placeholder="아이디" class="w-full p-3 rounded-xl bg-[#0B0B0D] border border-gray-700 outline-none"><input id="password" required type="password" placeholder="비밀번호" class="w-full p-3 rounded-xl bg-[#0B0B0D] border border-gray-700 outline-none"><button class="w-full bg-red-600 hover:bg-red-700 rounded-xl p-3 font-bold">로그인</button></form><p id="msg" class="text-sm mt-4 text-gray-400"></p><div class="mt-6 flex gap-3"><a href="signup.html" class="flex-1 text-center border border-gray-700 rounded-xl p-3 text-sm">회원가입</a><a href="comter.html" class="flex-1 text-center border border-gray-700 rounded-xl p-3 text-sm">홈으로</a></div></main><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='로그인 중...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'로그인 실패');localStorage.setItem('comter_token',d.token);localStorage.setItem('comter_user',JSON.stringify(d.user));location.href=d.user.role==='admin'?'admin.html':'comter.html';}catch(x){msg.textContent=x.message;msg.className='text-sm mt-4 text-red-400';}}</script></body></html>
